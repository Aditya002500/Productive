        body { font-family: 'Inter', sans-serif; }

      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen pb-3xl flex flex-col items-center">
<!-- Top App Bar - Transactional/Task Focus, hidden nav elements -->
<header class="w-full max-w-[600px] flex justify-between items-center px-margin-mobile h-16 z-50 bg-surface fixed top-0 left-1/2 -translate-x-1/2">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile text-on-surface font-semibold">New Task</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[600px] px-margin-mobile pt-24 flex flex-col gap-lg pb-3xl">
<!-- Task Title Input Area -->
<section class="bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-lg flex flex-col gap-sm">
<input autofocus="" class="w-full bg-transparent border-none text-headline-md font-headline-md focus:ring-0 placeholder:text-outline-variant p-0 m-0 text-on-surface focus:outline-none" placeholder="What needs to be done?" type="text"/>
<textarea class="w-full bg-transparent border-none text-body-lg font-body-lg text-on-surface-variant placeholder:text-outline focus:ring-0 p-0 m-0 resize-none focus:outline-none" placeholder="Add a description..." rows="2"></textarea>
</section>
<!-- Configuration Grid (Bento style) -->
<div class="grid grid-cols-2 gap-sm">
<!-- Priority Selection -->
<section class="col-span-2 bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-md flex flex-col gap-md">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Priority</span>
<div class="flex gap-sm w-full">
<button class="flex-1 py-sm rounded-lg border border-outline-variant flex items-center justify-center gap-xs font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors">
<div class="w-2 h-2 rounded-full bg-outline"></div> Low
                    </button>
<button class="flex-1 py-sm rounded-lg bg-secondary-container border border-secondary-container flex items-center justify-center gap-xs font-body-md text-body-md text-on-secondary-container transition-colors font-medium">
<div class="w-2 h-2 rounded-full bg-on-secondary-container"></div> Med
                    </button>
<button class="flex-1 py-sm rounded-lg border border-outline-variant flex items-center justify-center gap-xs font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors">
<div class="w-2 h-2 rounded-full bg-error"></div> High
                    </button>
</div>
</section>
<!-- Date Picker -->
<section class="col-span-1 bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-md flex flex-col justify-between aspect-square hover:bg-surface-container-lowest transition-all cursor-pointer group">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Due Date</span>
<div class="flex flex-col gap-xs">
<span class="material-symbols-outlined text-[32px] text-primary group-hover:scale-110 transition-transform">calendar_month</span>
<span class="font-headline-sm text-headline-sm-mobile text-on-surface mt-sm">Today</span>
</div>
</section>
<!-- Time Picker -->
<section class="col-span-1 bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-md flex flex-col justify-between aspect-square hover:bg-surface-container-lowest transition-all cursor-pointer group">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Reminder</span>
<div class="flex flex-col gap-xs">
<span class="material-symbols-outlined text-[32px] text-primary group-hover:scale-110 transition-transform">schedule</span>
<span class="font-headline-sm text-headline-sm-mobile text-on-surface mt-sm">None</span>
</div>
</section>
<!-- Project/Workspace -->
<section class="col-span-2 bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-md flex items-center justify-between cursor-pointer hover:bg-surface-container-low transition-colors">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container">
<span class="material-symbols-outlined">folder</span>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Workspace</span>
<span class="font-body-lg text-body-lg text-on-surface font-medium">Personal Projects</span>
</div>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</section>
<!-- Tags -->
<section class="col-span-2 bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-md flex flex-col gap-md overflow-hidden">
<div class="flex justify-between items-center w-full">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Tags</span>
<button class="w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[16px]">add</span>
</button>
</div>
<div class="flex gap-sm overflow-x-auto pb-sm snap-x w-full -mx-md px-md scrollbar-hide">
<div class="snap-start shrink-0 px-md py-sm rounded-full bg-surface-variant text-on-surface-variant font-label-md text-label-md flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-primary"></div> Design
                    </div>
<div class="snap-start shrink-0 px-md py-sm rounded-full bg-surface-variant text-on-surface-variant font-label-md text-label-md flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-tertiary"></div> Research
                    </div>
<div class="snap-start shrink-0 px-md py-sm rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors cursor-pointer">
                        Client X
                    </div>
<div class="snap-start shrink-0 px-md py-sm rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant transition-colors cursor-pointer">
                        Urgent
                    </div>
</div>
</section>
</div>
</main>
<!-- Floating Action Button / Fixed Bottom Action -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-surface-variant p-margin-mobile flex justify-center z-50">
<button class="w-full max-w-[568px] bg-[#4F46E5] text-white h-14 rounded-full font-headline-sm text-headline-sm-mobile flex items-center justify-center gap-sm active:scale-[0.98] transition-transform shadow-[0px_4px_12px_rgba(79,70,229,0.3)]">
<span class="material-symbols-outlined text-[20px]" data-weight="fill">check_circle</span>
            Save Task
        </button>
</div>

        /* Hide scrollbar for Chrome, Safari and Opera */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .scrollbar-hide {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
