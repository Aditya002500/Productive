<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CaptureFlow - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#002113",
                        "on-tertiary-container": "#006343",
                        "secondary-container": "#6df5e1",
                        "on-primary": "#ffffff",

                        "on-surface-variant": "#3b494a",
                        "inverse-primary": "#2cdbe0",

                        "on-primary-container": "#006063",
                        "error-container": "#ffdad6",
                        "background": "#f7f9fb",
                        "outline-variant": "#bac9c9",
                        "on-secondary-fixed": "#00201c",
                        "tertiary": "#006c49",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "secondary-fixed": "#71f8e4",
                        "primary": "#00696c",
                        "on-surface": "#191c1e",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-container": "#eceef0",
                        "surface-dim": "#d8dadc",
                        "tertiary-container": "#55e4a8",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed-dim": "#2cdbe0",
                        "on-primary-fixed-variant": "#004f51",
                        "error": "#ba1a1a",
                        "primary-fixed": "#59f8fd",
                        "surface-container-high": "#e6e8ea",
                        "surface-bright": "#f7f9fb",
                        "on-error-container": "#93000a",
                        "primary-container": "#37e1e6",
                        "on-secondary-container": "#006f64",
                        "surface": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#4edea3",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-primary-fixed": "#002021",
                        "on-background": "#191c1e",
                        "secondary-fixed-dim": "#4fdbc8",
                        "inverse-on-surface": "#eff1f3",
                        "on-secondary-fixed-variant": "#005048"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "2xl": "48px",
                        "lg": "24px",
                        "margin-desktop": "32px",
                        "xl": "32px",
                        "base": "8px",
                        "margin-mobile": "16px",
                        "sm": "8px",
                        "xs": "4px",
                        "gutter": "16px",
                        "3xl": "64px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }]

                }

        }

</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface antialiased">
<!-- Main Container -->
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-[16px] shadow-[0px_12px_32px_rgba(0,0,0,0.1)] p-xl md:p-2xl flex flex-col items-center">
<!-- Logo -->
<div class="w-[80px] h-[80px] mb-lg rounded-xl overflow-hidden shadow-[0px_4px_12px_rgba(0,0,0,0.05)]">
<img alt="CaptureFlow Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLvioOHBLAnoi9rs2otwVh9yjyZjWkl0tR_ld-I-yTZhgQsS7treUP_aStJJtACtxFQU8vZ572yXP3Ox06nUeN-CdFsHMDiPoZyrUGih6rtG0XOuycSZUh-2CjH4U7TBVoRQYyFomtvRKKpvaeNMcK1_NJjHrqpbwgcehviZHE34ezhiiWLqZO70UxyeUNtDFgk4JWNbB4GtOrS8KN9Fw7QRwA2_sETh2gzhDNcDxkTlP9rWE-pPprz56KNI"/>
</div>
<!-- Header Text -->
<div class="text-center mb-xl w-full">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-sm">
                Welcome Back
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Sign in to continue your flow.
            </p>
</div>
<!-- Form -->
<form action="#" class="w-full space-y-md" method="POST">
<!-- Email Field -->
<div class="w-full">
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-surface-container-lowest border border-surface-variant rounded-[8px] pl-[44px] pr-md py-[12px] font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200" id="email" name="email" placeholder="email@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="w-full">
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-surface-container-lowest border border-surface-variant rounded-[8px] pl-[44px] pr-md py-[12px] font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-sm text-headline-sm rounded-[8px] py-[12px] hover:opacity-90 active:scale-[0.98] transition-all duration-200 mt-md flex justify-center items-center shadow-[0px_4px_12px_rgba(0,0,0,0.05)]" type="submit">
                Sign In
            </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-lg relative">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="mx-md font-label-caps text-label-caps text-outline bg-surface-container-lowest px-sm">OR CONTINUE WITH</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Google Button -->
<button class="w-full bg-surface-container-lowest border border-surface-variant text-on-surface font-body-md text-body-md rounded-[8px] py-[12px] hover:bg-surface-container-low active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-sm" type="button">
<!-- Google Icon SVG (simplified) -->
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Continue with Google
        </button>
<!-- Create Account Link -->
<div class="mt-xl text-center w-full">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-headline-sm text-headline-sm text-[14px] hover:underline hover:text-primary-container transition-colors" href="#">Create Account</a>
</p>
</div>
</main>
</body></html>
