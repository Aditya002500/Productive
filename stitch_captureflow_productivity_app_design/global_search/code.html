<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-3xl flex flex-col items-center">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-background dark:bg-background">
<div class="flex justify-between items-center px-margin-mobile py-base w-full max-w-7xl mx-auto">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-150 ease-in-out p-sm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile md:font-headline-sm md:text-headline-sm font-bold tracking-tight text-on-background">Search</h1>
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden shadow-sm">
<img class="w-full h-full object-cover" data-alt="A small circular avatar of a professional user in a minimalist bright setting, fitting a sleek productivity app profile picture." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBMJ0FTUw0XTPsMVSTK5YwFTZR4GHAcRg-NyrkQ40r4tLrjFYz4ZcHmpbWKq8B9SKD4Kcj_Z6EyrOpwxBMvpo2Y54zSuL1aOfXT39ooctW37PC2gvkwN3Dvgn6M7uuyMsQspZcAlEz0Ucae-22f4_8yMNO-AA1NDkMLe1Co5smAff0aTzNEILnqPRKmqdaEWs2UxjH8Dv1gDHAM-5G06TepzzWHn4ut8hJrrDsSGaW5eoBPSZNypT2Teseo8O7bJWSqr02laBnScDE_"/>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="w-full max-w-7xl mx-auto px-margin-mobile flex-1 flex flex-col gap-xl pt-lg">
<!-- Search Input -->
<section class="w-full">
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">search</span>
</div>
<input autofocus="" class="w-full bg-surface-container-lowest text-on-surface border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary rounded-xl py-lg pl-3xl pr-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] transition-all font-body-lg text-body-lg placeholder-outline h-14" placeholder="Search tasks, notes, screenshots..." type="text"/>
</div>
</section>
<!-- Filters Section -->
<section class="w-full">
<div class="flex items-center justify-between mb-md">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Filters</h2>
</div>
<div class="flex gap-sm overflow-x-auto pb-sm snap-x hide-scrollbar" style="scrollbar-width: none; -ms-overflow-style: none;">
<!-- Filter Chips -->
<button class="flex items-center gap-xs bg-surface-container-highest text-on-surface px-md py-sm rounded-full hover:bg-primary-container hover:text-on-primary-container transition-colors snap-start whitespace-nowrap">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
<span class="font-label-md text-label-md">Tasks</span>
</button>
<button class="flex items-center gap-xs bg-surface-container-highest text-on-surface px-md py-sm rounded-full hover:bg-primary-container hover:text-on-primary-container transition-colors snap-start whitespace-nowrap">
<span class="material-symbols-outlined text-[18px]">description</span>
<span class="font-label-md text-label-md">Notes</span>
</button>
<button class="flex items-center gap-xs bg-surface-container-highest text-on-surface px-md py-sm rounded-full hover:bg-primary-container hover:text-on-primary-container transition-colors snap-start whitespace-nowrap">
<span class="material-symbols-outlined text-[18px]">image</span>
<span class="font-label-md text-label-md">Screenshots</span>
</button>
<button class="flex items-center gap-xs bg-surface-container-highest text-on-surface px-md py-sm rounded-full hover:bg-primary-container hover:text-on-primary-container transition-colors snap-start whitespace-nowrap">
<span class="material-symbols-outlined text-[18px]">event</span>
<span class="font-label-md text-label-md">Events</span>
</button>
</div>
</section>
<!-- Suggested Searches -->
<section class="w-full">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider mb-md">Suggested Searches</h2>
<div class="flex flex-wrap gap-sm">
<button class="bg-surface-container-low text-on-surface-variant px-md py-sm rounded-lg hover:bg-surface-container-high transition-colors border border-outline-variant/30 flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">trending_up</span>
<span class="font-body-md text-body-md">Incomplete Tasks</span>
</button>
<button class="bg-surface-container-low text-on-surface-variant px-md py-sm rounded-lg hover:bg-surface-container-high transition-colors border border-outline-variant/30 flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">history</span>
<span class="font-body-md text-body-md">Last 7 Days</span>
</button>
<button class="bg-surface-container-low text-on-surface-variant px-md py-sm rounded-lg hover:bg-surface-container-high transition-colors border border-outline-variant/30 flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">receipt_long</span>
<span class="font-body-md text-body-md">Receipts</span>
</button>
</div>
</section>
<!-- Recent Searches -->
<section class="w-full">
<div class="flex items-center justify-between mb-md">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Recent</h2>
<button class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors">Clear all</button>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] overflow-hidden">
<ul class="divide-y divide-surface-variant">
<li class="flex items-center justify-between p-md hover:bg-surface-container-low transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">history</span>
<span class="font-body-md text-body-md text-on-surface">Q3 Roadmap</span>
</div>
<button class="text-outline-variant hover:text-error transition-colors p-sm rounded-full">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</li>
<li class="flex items-center justify-between p-md hover:bg-surface-container-low transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">history</span>
<span class="font-body-md text-body-md text-on-surface">Design Specs</span>
</div>
<button class="text-outline-variant hover:text-error transition-colors p-sm rounded-full">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</li>
<li class="flex items-center justify-between p-md hover:bg-surface-container-low transition-colors cursor-pointer group">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors">history</span>
<span class="font-body-md text-body-md text-on-surface">Groceries</span>
</div>
<button class="text-outline-variant hover:text-error transition-colors p-sm rounded-full">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</li>
</ul>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container-lowest dark:bg-surface-container-lowest shadow-[0px_-4px_12px_rgba(0,0,0,0.05)] md:hidden">
<div class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile pb-base pt-sm bg-surface-container-lowest dark:bg-surface-container-lowest">
<!-- Home (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-md py-xs hover:bg-surface-container-high transition-all active:scale-90 duration-200 rounded-lg group">
<span class="material-symbols-outlined group-hover:text-on-surface transition-colors" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-md text-label-md mt-xs group-hover:text-on-surface transition-colors">Home</span>
</button>
<!-- Planner (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-md py-xs hover:bg-surface-container-high transition-all active:scale-90 duration-200 rounded-lg group">
<span class="material-symbols-outlined group-hover:text-on-surface transition-colors" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
<span class="font-label-md text-label-md mt-xs group-hover:text-on-surface transition-colors">Planner</span>
</button>
<!-- Capture (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-md py-xs hover:bg-surface-container-high transition-all active:scale-90 duration-200 rounded-lg group">
<span class="material-symbols-outlined group-hover:text-on-surface transition-colors" style="font-variation-settings: 'FILL' 0;">center_focus_strong</span>
<span class="font-label-md text-label-md mt-xs group-hover:text-on-surface transition-colors">Capture</span>
</button>
<!-- Notes (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-md py-xs hover:bg-surface-container-high transition-all active:scale-90 duration-200 rounded-lg group">
<span class="material-symbols-outlined group-hover:text-on-surface transition-colors" style="font-variation-settings: 'FILL' 0;">description</span>
<span class="font-label-md text-label-md mt-xs group-hover:text-on-surface transition-colors">Notes</span>
</button>
<!-- Search (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-on-primary-fixed-variant text-on-primary-container dark:text-primary-fixed rounded-full px-md py-xs active:scale-90 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">search</span>
<span class="font-label-md text-label-md mt-xs font-semibold">Search</span>
</button>
</div>
</nav>
</body></html>
