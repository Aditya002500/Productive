<style>
        body {
            background-color: #f7f9fb;
            color: #191c1e;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .hero-mockup-bg {
            background: radial-gradient(circle at center, rgba(79, 70, 229, 0.05) 0%, rgba(247, 249, 251, 0) 70%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);

            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }
        .mockup-item {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
        }
        .mockup-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(79, 70, 229, 0.1);
        }
        
        /* Floating animations for mockup elements */
        @keyframes float-slow {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        @keyframes float-medium {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        @keyframes float-fast {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        
        .anim-float-1 { animation: float-slow 6s ease-in-out infinite; }
        .anim-float-2 { animation: float-medium 7s ease-in-out infinite 1s; }
        .anim-float-3 { animation: float-fast 5s ease-in-out infinite 0.5s; }
