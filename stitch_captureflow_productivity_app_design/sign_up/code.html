<body class="bg-background text-on-surface antialiased min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-lg text-body-lg">

<h1 class="font-headline-md text-headline-md text-on-surface">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Start your journey to effortless productivity.</p>
</header>
<form action="#" class="flex flex-col gap-lg" method="POST">
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<input class="w-full h-12 px-md py-base rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="email">Email</label>
<input class="w-full h-12 px-md py-base rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<input class="w-full h-12 px-md py-base rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="confirmPassword">Confirm Password</label>
<input class="w-full h-12 px-md py-base rounded-md border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-2 focus:ring-primary focus:outline-none transition-colors" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full h-12 bg-primary-container text-on-primary-fixed-variant font-label-md text-label-md rounded-md mt-sm hover:opacity-90 transition-opacity active:scale-[0.98] flex items-center justify-center font-semibold" type="submit">
                Create Account
            </button>
</form>
<div class="flex items-center gap-md">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">or</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
<button class="w-full h-12 bg-surface-container-lowest border border-outline text-on-surface font-label-md text-label-md rounded-md hover:bg-surface-container-low transition-colors active:scale-[0.98] flex items-center justify-center gap-sm" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

</svg>
            Google Sign Up
        </button>
<p class="text-center font-body-md text-body-md text-on-surface-variant mt-sm">
            Already have an account? <a class="text-primary hover:underline font-semibold" href="#">Log in</a>
</p>
